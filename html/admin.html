<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | VRAFM</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <nav class="navbar"><a class="brand" href="index.html">VRAFM Admin</a>
        <div class="navlinks"><a href="customers.html">Customers</a><a href="maintenance.html">Maintenance</a><button
                id="logoutBtn" class="link-button">Logout</button></div>
    </nav>
    <main class="page"><span class="eyebrow">MANAGEMENT</span>
        <h1>Admin dashboard</h1>
        <div id="stats" class="stats-grid"></div>
        <div class="admin-layout">
            <section class="panel">
                <h2>Add a vehicle</h2>
                <form id="vehicleForm" class="compact-form"><input name="name" placeholder="Vehicle name"
                        required><input name="brand" placeholder="Brand" required><select name="category">
                        <option>SUV</option>
                        <option>Sedan</option>
                        <option>Hatchback</option>
                    </select><input name="price_per_day" type="number" min="1" placeholder="Price per day (₹)"
                        required><input name="fuel" placeholder="Fuel" value="Petrol"><input name="transmission"
                        placeholder="Transmission" value="Manual"><input name="seats" type="number" value="5"><input
                        name="image_url" placeholder="Image URL (optional)"><textarea name="description"
                        placeholder="Short description"></textarea><button class="btn">Add vehicle</button>
                    <p id="vehicleMessage" class="message"></p>
                </form>
            </section>
            <section class="panel">
                <h2>Fleet vehicles</h2>
                <div id="adminVehicles"></div>
            </section>
        </div>
        <section class="panel">
            <h2>Recent bookings</h2>
            <div id="adminBookings" class="table-wrap"></div>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
